name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
      - "chore/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 stable platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Validate Gradle wrapper
        run: chmod +x gradlew

      - name: Compile, test, assemble debug, and bundle release
        run: ./gradlew --no-daemon clean testDebugUnitTest assembleDebug bundleRelease --stacktrace

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-bundle-${{ github.sha }}
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
