name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "fix/**"
      - "feat/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 17 preview platform
        run: sdkmanager --channel=3 "platforms;android-37" "build-tools;37.0.0"

      - name: Validate Gradle wrapper
        run: chmod +x gradlew

      - name: Compile, test, and assemble debug
        run: ./gradlew --no-daemon clean testDebugUnitTest assembleDebug --stacktrace
